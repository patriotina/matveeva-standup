# Заголовки безопасности одним блоком.
#
# Подключается и в server{}, и в location статики: директива add_header
# в дочернем блоке полностью отменяет унаследованные от родителя. Без
# include CSS и JS уезжали бы без CSP и остальных заголовков.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; form-action 'self' https://script.google.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'self'; frame-ancestors 'none'" always;

# HSTS только на HTTPS-ответах: по HTTP он бесполезен, а на локальный домен
# или IP «прилипает» намертво и ломает отладку. Traefik передаёт схему
# исходного запроса в X-Forwarded-Proto.
add_header Strict-Transport-Security $hsts always;
