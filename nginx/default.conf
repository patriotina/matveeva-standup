# Конфигурация статического сайта. Монтируется в
# /etc/nginx/conf.d/default.conf внутри контейнера nginx:alpine.
#
# Отдаём только статику: ни проксирования, ни кэширующих слоёв сверху.
# Всё, что касается TLS и домена, живёт в labels Traefik (см.
# docker-compose.deploy.yml) — сюда его дублировать не нужно.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;

    # Основные MIME-типы. nginx:alpine приносит mime.types, но мы
    # подключаем его явно: конфиг не должен зависеть от того, что
    # include уже прописан в родительском http{}.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Лендинг — одна страница и пара файлов. Сжатие окупается на каждом
    # запросе: шрифт и стили поедут по сети заметно меньше.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # HSTS подставляется в security-headers.conf, значение зависит от схемы.
    set $hsts "";
    if ($http_x_forwarded_proto = "https") {
        set $hsts "max-age=31536000; includeSubDomains";
    }

    include /etc/nginx/conf.d/security-headers.conf;

    # HTML не кэшируем: правки контента и даты события должны доезжать до
    # посетителей сразу после деплоя, без «жёсткого» обновления.
    add_header Cache-Control "no-cache" always;

    # Версионированных имён файлов у нас нет, поэтому статику кэшируем
    # недолго. После правки script.js посетитель получит новую версию в
    # пределах часа. Заголовки безопасности подключаем повторно: add_header
    # в location отменяет все унаследованные от server.
    location ~* \.(?:css|js|svg|ico|png|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Не отдаём наружу служебные файлы, даже если они случайно попадут
    # в каталог сайта.
    location ~ /\.(?!well-known) {
        return 404;
    }
}
